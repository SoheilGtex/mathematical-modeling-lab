<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img" aria-labelledby="title desc">
<title id="title">Two triangular fuzzy numbers and the exact crossing</title>
<desc id="desc">M has vertices (2,0),(5,1),(12,0). N has vertices (2,0),(4,1),(10,0). Their nonzero interior crossing is z equal to fourteen thirds, membership eight ninths.</desc>
<rect width="960" height="415" fill="#fff"/>
<line x1="100" y1="340" x2="930" y2="340" stroke="#64748b" stroke-width="2"/>
<line x1="110" y1="355" x2="110" y2="55" stroke="#64748b" stroke-width="2"/>
<line x1="103" y1="80" x2="915" y2="80" stroke="#e5e7eb" stroke-dasharray="4 5"/>
<text x="79" y="85" text-anchor="end" fill="#334155" font-family="sans-serif" font-size="18">1</text>
<text x="80" y="360" text-anchor="end" fill="#334155" font-family="sans-serif" font-size="18">0</text>
<text x="920" y="372" text-anchor="end" fill="#334155" font-family="sans-serif" font-size="18">z</text>
<polyline points="152.0,340.0 368.0,80.0 872.0,340.0" stroke="#1769aa" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="152.0,340.0 296.0,80.0 728.0,340.0" stroke="#ca6c21" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="344.0" cy="108.9" r="6" fill="#111827" stroke="#fff" stroke-width="2"/>
<line x1="344.0" y1="118.9" x2="344.0" y2="340" stroke="#475569" stroke-dasharray="5 5"/>
<text x="369.0" y="88.9" fill="#111827" font-family="sans-serif" font-size="18">(14/3, 8/9)</text>
<text x="440" y="49" fill="#1769aa" font-family="sans-serif" font-size="21" font-weight="bold">M = (2, 5, 12)</text>
<text x="680" y="49" fill="#ca6c21" font-family="sans-serif" font-size="21" font-weight="bold">N = (2, 4, 10)</text>
<line x1="152.0" y1="340" x2="152.0" y2="348" stroke="#64748b"/><text x="152.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">2</text>
<line x1="296.0" y1="340" x2="296.0" y2="348" stroke="#64748b"/><text x="296.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">4</text>
<line x1="368.0" y1="340" x2="368.0" y2="348" stroke="#64748b"/><text x="368.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">5</text>
<line x1="728.0" y1="340" x2="728.0" y2="348" stroke="#64748b"/><text x="728.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">10</text>
<line x1="872.0" y1="340" x2="872.0" y2="348" stroke="#64748b"/><text x="872.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">12</text>
</svg>
