name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check cumulative exam-night review
        run: python scripts/build_exam_night.py --check
      - name: Check bilingual documentation completeness
        run: python scripts/check_site_docs.py
      - name: Run tests
        run: python -m pytest -q
